# Regression gates for the eval suites.
#
# Each metric carries two numbers:
#   baseline — what the committed run under evals/results/ actually measured
#   floor    — the value below which the suite exits non-zero
#
# Floors are deliberately NOT set at the baseline. A gate that reds the build on
# judge noise is a gate that gets switched off, and then nothing is gated at all.
# So the headroom is sized to how much each number can actually move:
#
#   retrieval  — deterministic. Same corpus, same embeddings, same SQL, same
#                answer every time. Floors sit just under baseline, because any
#                real movement is a real change.
#   ragas      — judged by an LLM over 38 questions. One question flipping shifts
#                a mean by ~0.026, so floors allow a few questions of drift but
#                not a systematic collapse.
#   redteam    — a security suite. No headroom: any failure is a regression worth
#                a red build. If it turns out to be model noise, that is still
#                the finding — a refusal that only holds 13 times in 14 is not a
#                refusal you can claim.
#
# Sample-set size is gated too. A suite that silently scores fewer questions can
# post a better mean while covering less, which is the failure mode a naive
# threshold check misses entirely. It is gated twice — once over the run and
# once per metric — because a single mean can shrink underneath a run-level
# count that never moves.

ragas:
  # Baselines are the committed run in evals/results/ragas.json (2026-08-03).
  # An earlier single run on 2026-07-12 scored faithfulness 0.9644; two runs on
  # 2026-08-03 scored 0.9176 and 0.9316 with retrieval byte-identical and the
  # ragas version unchanged. One run is not an estimate of an LLM-judged metric
  # — the floors below are sized for that spread, not for the best draw.
  # STALE, deliberately left in place until a full run replaces it: both
  # 2026-08-03 figures above are means over a SUBSET. The faithfulness judge hit
  # a 1024-token output limit on the longest answers and lost 15 and 10
  # questions respectively — questions that stayed in the other three metrics
  # and in `expect_n_scored`. The spread those floors were sized for is
  # therefore partly a change of population, not a judge draw, and the dropped
  # questions were the long cross-regulation ones. Baseline and floor both need
  # re-deriving from a run that scores all 38; the numbers below are not touched
  # here because a threshold is only worth what the run behind it measured.
  expect_n_scored: 38
  max_chat_failures: 0
  # A judge call that dies used to score its question `None`, and `None` was
  # then dropped from that one metric's mean while the question stayed in every
  # other metric's — so the run reported a full 38 and published a mean over 23.
  # It is not random loss either: the judge died on long answers, so what it
  # removed was the hard half and the surviving mean read high. Zero, because a
  # mean over a silently-chosen subset is not a measurement of anything.
  max_judge_failures: 0
  # Not a judged metric and so no headroom: the [n] markers are either there or
  # the answer's sources are unlinked in the UI. Zero, because "most answers
  # cite properly" is not a property you can ship a citation panel on. The
  # committed run predates the check and does not carry the field — see
  # backend/tests/test_eval_gate.py.
  max_answers_without_inline_citation: 0
  # An answer the grounding verifier refused is excluded from the check above —
  # it makes no claims, so it cites nothing, and counting it would make the
  # fail-closed path read as a formatting defect. The cheapest way to green that
  # would be to weaken the verifier, which is the one incentive this suite must
  # not create.
  #
  # But the exclusion needs a ceiling or the citation check can pass over an
  # empty set. Sized from five scored runs: 0 or 1, always G11, where the
  # verifier disagrees with itself between runs. Two allows that flip plus one
  # more; beyond it, answers are getting worse, not the gate stricter.
  max_answers_refused_as_ungrounded: 2
  metrics:
    faithfulness: { baseline: 0.9316, floor: 0.90 }
    answer_relevancy: { baseline: 0.8805, floor: 0.78 }
    context_precision: { baseline: 0.8490, floor: 0.78 }
    context_recall: { baseline: 0.9605, floor: 0.90 }

retrieval:
  expect_n_questions: 38
  modes:
    hybrid:
      metrics:
        hit_rate_at_k: { baseline: 1.0, floor: 0.97 }
        mrr: { baseline: 0.8912, floor: 0.87 }
        mean_article_recall: { baseline: 0.8969, floor: 0.87 }
    vector_only:
      metrics:
        hit_rate_at_k: { baseline: 1.0, floor: 0.97 }
        mrr: { baseline: 0.9044, floor: 0.88 }
        mean_article_recall: { baseline: 0.8969, floor: 0.87 }
    # Text-only is a committed NEGATIVE result: plainto_tsquery AND-semantics
    # stays silent on natural-language questions by design. It is gated with a
    # ceiling rather than a floor — if this arm suddenly scores well, the query
    # semantics changed underneath us and the hybrid ablation no longer means
    # what the README says it means.
    text_only:
      metrics:
        hit_rate_at_k: { baseline: 0.0263, ceiling: 0.20 }

redteam:
  expect_total: 14
  min_passed: 14
