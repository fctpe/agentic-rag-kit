# Golden question set for agentic-rag-kit evals.
#
# 45 hand-written Q/A pairs over Regulation (EU) 2024/1689 (AI Act) and
# Regulation (EU) 2016/679 (GDPR), plus out-of-scope probes where the correct
# behavior is refusal/deflection.
#
# Fields:
#   id                stable identifier (A* = AI Act, G* = GDPR, X* = cross, O* = out of scope)
#   question          the user query sent to retrieval / the chat API
#   expected_articles labels of the form "AI Act Art. N" / "GDPR Art. N"
#                     (matched against chunks.article_ref + documents.regulation)
#   reference_answer  2-4 factually precise sentences used as RAGAS reference
#   query_type        definition | obligation | prohibition | cross_regulation | scope | out_of_scope
#   difficulty        easy | medium | hard
#
# Notes:
# - Question wording deliberately avoids the backend's report-routing markers
#   ("report", "memo", "checklist", "gap analysis", "executive summary", "draft")
#   so /chat completes without the human-approval interrupt — except O02, which
#   is an out-of-scope entry and is skipped by run_evals.py.
# - Timing claims reflect the 2026 Digital Omnibus: the Annex III high-risk
#   obligations of the AI Act were postponed to December 2027.

questions:
  # ---------------------------------------------------------------- AI Act ---
  - id: A01
    question: "How does the EU AI Act define an 'AI system'?"
    expected_articles: ["AI Act Art. 3"]
    reference_answer: >-
      Article 3(1) of the AI Act defines an 'AI system' as a machine-based
      system designed to operate with varying levels of autonomy, that may
      exhibit adaptiveness after deployment, and that, for explicit or implicit
      objectives, infers from the input it receives how to generate outputs
      such as predictions, content, recommendations or decisions that can
      influence physical or virtual environments.
    query_type: definition
    difficulty: easy

  - id: A02
    question: "Which AI practices are outright prohibited under the EU AI Act?"
    expected_articles: ["AI Act Art. 5"]
    reference_answer: >-
      Article 5 prohibits placing on the market or using AI that deploys
      subliminal or purposefully manipulative techniques materially distorting
      behaviour and causing significant harm, exploits vulnerabilities due to
      age, disability or social/economic situation, performs social scoring
      leading to detrimental or disproportionate treatment, assesses the risk
      of a person committing a criminal offence based solely on profiling,
      builds facial-recognition databases through untargeted scraping, infers
      emotions in the workplace or education (except for medical or safety
      reasons), uses biometric categorisation to infer sensitive attributes,
      and uses real-time remote biometric identification in publicly
      accessible spaces for law enforcement outside narrow exceptions.
    query_type: prohibition
    difficulty: easy

  - id: A03
    question: "Does the EU AI Act apply to companies that are established outside the EU?"
    expected_articles: ["AI Act Art. 2"]
    reference_answer: >-
      Yes. Under Article 2, the AI Act applies to providers placing AI systems
      on the Union market or putting them into service in the Union
      irrespective of where they are established, to deployers established or
      located in the Union, and to providers and deployers in third countries
      where the output produced by the AI system is used in the Union.
    query_type: scope
    difficulty: medium

  - id: A04
    question: "Under what conditions may law enforcement use real-time remote biometric identification in public spaces under the AI Act?"
    expected_articles: ["AI Act Art. 5"]
    reference_answer: >-
      Article 5(1)(h) prohibits real-time remote biometric identification in
      publicly accessible spaces for law-enforcement purposes, except where
      strictly necessary for exhaustively listed objectives: the targeted
      search for victims of abduction, trafficking or sexual exploitation and
      for missing persons; the prevention of a specific, substantial and
      imminent threat to life or safety or a genuine and foreseeable terrorist
      threat; and the localisation or identification of suspects of serious
      offences. Each use requires prior authorisation by a judicial authority
      or an independent administrative authority and is subject to safeguards
      and limits set out in Article 5(2)-(7).
    query_type: prohibition
    difficulty: medium

  - id: A05
    question: "What is the difference between a 'provider' and a 'deployer' under the AI Act?"
    expected_articles: ["AI Act Art. 3"]
    reference_answer: >-
      Under Article 3(3), a 'provider' is a natural or legal person or body
      that develops an AI system or general-purpose AI model (or has one
      developed) and places it on the market or puts it into service under its
      own name or trademark, whether for payment or free of charge. Under
      Article 3(4), a 'deployer' is a person or body using an AI system under
      its authority, except where the system is used in the course of a
      personal non-professional activity.
    query_type: definition
    difficulty: medium

  - id: A06
    question: "How does an AI system get classified as high-risk under the AI Act?"
    expected_articles: ["AI Act Art. 6"]
    reference_answer: >-
      Article 6 sets two routes: a system is high-risk if it is a safety
      component of a product (or is itself a product) covered by the Union
      harmonisation legislation listed in Annex I and subject to third-party
      conformity assessment, or if it falls under a use case listed in
      Annex III. Article 6(3) provides a derogation for Annex III systems that
      do not pose a significant risk to health, safety or fundamental rights,
      for example those performing a narrow procedural or preparatory task,
      though profiling of natural persons is always high-risk. Following the
      2026 Digital Omnibus amendment, the obligations for Annex III high-risk
      systems apply from December 2027.
    query_type: obligation
    difficulty: medium

  - id: A07
    question: "What does the AI Act require regarding AI literacy?"
    expected_articles: ["AI Act Art. 4"]
    reference_answer: >-
      Article 4 requires providers and deployers of AI systems to take
      measures to ensure, to their best extent, a sufficient level of AI
      literacy of their staff and other persons dealing with the operation and
      use of AI systems on their behalf, taking into account their technical
      knowledge, experience, education and training, the context of use, and
      the persons affected.
    query_type: obligation
    difficulty: easy

  - id: A08
    question: "Can the European Commission change which use cases count as high-risk in Annex III of the AI Act?"
    expected_articles: ["AI Act Art. 7"]
    reference_answer: >-
      Yes. Article 7 empowers the Commission to adopt delegated acts amending
      Annex III by adding or modifying use cases where an AI system poses a
      risk of harm to health, safety or fundamental rights that is equivalent
      to or greater than that of the systems already listed, assessed against
      criteria such as the intended purpose, the extent of use, and the harm
      already caused. The Commission may also remove use cases that no longer
      meet those criteria without lowering the overall level of protection.
    query_type: obligation
    difficulty: medium

  - id: A09
    question: "What must a risk management system for high-risk AI systems cover under the AI Act?"
    expected_articles: ["AI Act Art. 9"]
    reference_answer: >-
      Article 9 requires providers of high-risk AI systems to establish a risk
      management system that runs as a continuous, iterative process across
      the entire lifecycle: identifying and analysing known and reasonably
      foreseeable risks to health, safety and fundamental rights, estimating
      and evaluating risks from intended use and reasonably foreseeable
      misuse, and adopting targeted risk-management measures. The system must
      be tested to identify the most appropriate measures, and residual risks
      must be judged acceptable.
    query_type: obligation
    difficulty: medium

  - id: A10
    question: "What data governance requirements apply to training data for high-risk AI systems?"
    expected_articles: ["AI Act Art. 10"]
    reference_answer: >-
      Article 10 requires that training, validation and testing datasets for
      high-risk AI systems be subject to data-governance practices covering
      design choices, data provenance and collection, preparation operations,
      assumptions about what the data measures, availability and suitability
      assessment, and examination and mitigation of possible biases. Datasets
      must be relevant, sufficiently representative and, to the best extent
      possible, free of errors and complete in view of the intended purpose.
    query_type: obligation
    difficulty: medium

  - id: A11
    question: "What does the AI Act say about human oversight of high-risk AI systems?"
    expected_articles: ["AI Act Art. 14"]
    reference_answer: >-
      Article 14 requires high-risk AI systems to be designed and developed so
      that natural persons can effectively oversee them while in use, in order
      to prevent or minimise risks to health, safety and fundamental rights.
      Oversight measures must enable the overseer to understand the system's
      capacities and limitations, remain aware of automation bias, correctly
      interpret output, decide not to use the system or disregard its output,
      and intervene in or interrupt its operation through a stop control.
    query_type: obligation
    difficulty: medium

  - id: A12
    question: "Do chatbot operators have to tell users they are talking to an AI under the AI Act?"
    expected_articles: ["AI Act Art. 50"]
    reference_answer: >-
      Yes. Article 50 requires providers to ensure that AI systems intended to
      interact directly with natural persons are designed so that the persons
      concerned are informed they are interacting with an AI system, unless
      this is obvious to a reasonably well-informed person. Article 50 also
      requires machine-readable marking of synthetic content, disclosure of
      deepfakes by deployers, and informing exposed persons where emotion
      recognition or biometric categorisation systems are used.
    query_type: obligation
    difficulty: medium

  - id: A13
    question: "When is a general-purpose AI model considered to pose systemic risk, and what extra obligations follow?"
    expected_articles: ["AI Act Art. 51", "AI Act Art. 55"]
    reference_answer: >-
      Under Article 51, a general-purpose AI model is classified as having
      systemic risk if it has high-impact capabilities evaluated on the basis
      of technical tools and benchmarks, with a presumption when the
      cumulative compute used for its training exceeds 10^25 floating point
      operations, or if the Commission so designates it. Article 55 then adds
      obligations: performing model evaluations including adversarial testing,
      assessing and mitigating systemic risks at Union level, tracking and
      reporting serious incidents to the AI Office, and ensuring adequate
      cybersecurity protection.
    query_type: obligation
    difficulty: hard

  - id: A14
    question: "Which activities are excluded from the scope of the AI Act?"
    expected_articles: ["AI Act Art. 2"]
    reference_answer: >-
      Article 2 excludes, among others, AI systems placed on the market or
      used exclusively for military, defence or national security purposes,
      systems and models developed and put into service for the sole purpose
      of scientific research and development, research and testing activity
      prior to placing on the market (except real-world testing), and use by
      natural persons in the course of a purely personal non-professional
      activity. Free and open-source AI systems are also largely out of
      scope unless they constitute prohibited practices, are high-risk, or
      fall under the Article 50 transparency obligations.
    query_type: scope
    difficulty: medium

  - id: A15
    question: "How high can fines go for engaging in a prohibited AI practice?"
    expected_articles: ["AI Act Art. 99"]
    reference_answer: >-
      Under Article 99(3), non-compliance with the Article 5 prohibitions is
      subject to administrative fines of up to EUR 35 million or, for an
      undertaking, up to 7 percent of its total worldwide annual turnover for
      the preceding financial year, whichever is higher. Most other
      violations of the Act carry fines of up to EUR 15 million or 3 percent
      of turnover, and supplying incorrect or misleading information to
      authorities up to EUR 7.5 million or 1 percent.
    query_type: obligation
    difficulty: hard

  # ----------------------------------------------------------------- GDPR ---
  - id: G01
    question: "What counts as 'personal data' under the GDPR?"
    expected_articles: ["GDPR Art. 4"]
    reference_answer: >-
      Article 4(1) defines personal data as any information relating to an
      identified or identifiable natural person (the data subject). An
      identifiable person is one who can be identified, directly or
      indirectly, in particular by reference to an identifier such as a name,
      an identification number, location data, an online identifier, or
      factors specific to their physical, physiological, genetic, mental,
      economic, cultural or social identity.
    query_type: definition
    difficulty: easy

  - id: G02
    question: "What is the difference between a controller and a processor under the GDPR?"
    expected_articles: ["GDPR Art. 4"]
    reference_answer: >-
      Under Article 4(7), the controller is the natural or legal person,
      public authority, agency or other body which alone or jointly with
      others determines the purposes and means of the processing of personal
      data. Under Article 4(8), the processor is a body which processes
      personal data on behalf of the controller, acting on its documented
      instructions.
    query_type: definition
    difficulty: easy

  - id: G03
    question: "What are the lawful bases for processing personal data under the GDPR?"
    expected_articles: ["GDPR Art. 6"]
    reference_answer: >-
      Article 6(1) makes processing lawful only if at least one of six bases
      applies: the data subject's consent; necessity for the performance of a
      contract with the data subject; compliance with a legal obligation of
      the controller; protection of the vital interests of the data subject or
      another person; performance of a task in the public interest or in the
      exercise of official authority; or the legitimate interests of the
      controller or a third party, unless overridden by the data subject's
      interests and fundamental rights. The legitimate-interests basis is not
      available to public authorities in the performance of their tasks.
    query_type: obligation
    difficulty: easy

  - id: G04
    question: "What conditions must consent meet to be valid under the GDPR?"
    expected_articles: ["GDPR Art. 7", "GDPR Art. 4"]
    reference_answer: >-
      Consent must be a freely given, specific, informed and unambiguous
      indication of the data subject's wishes expressed by a statement or a
      clear affirmative action (Article 4(11)). Under Article 7, the
      controller must be able to demonstrate consent, the request must be
      clearly distinguishable and in plain language, the data subject may
      withdraw consent at any time as easily as it was given, and whether
      performance of a contract is conditioned on unnecessary consent is taken
      into utmost account when assessing whether consent is freely given.
    query_type: obligation
    difficulty: medium

  - id: G05
    question: "When does the GDPR apply to organisations that have no establishment in the EU?"
    expected_articles: ["GDPR Art. 3"]
    reference_answer: >-
      Under Article 3(2), the GDPR applies to processing of personal data of
      data subjects who are in the Union by a controller or processor not
      established in the Union where the processing relates to offering goods
      or services to such data subjects (regardless of payment) or to
      monitoring their behaviour as far as it takes place within the Union.
      Article 3(1) separately covers processing in the context of the
      activities of an EU establishment, regardless of where the processing
      itself takes place.
    query_type: scope
    difficulty: medium

  - id: G06
    question: "What are the core data protection principles in Article 5 GDPR?"
    expected_articles: ["GDPR Art. 5"]
    reference_answer: >-
      Article 5(1) requires that personal data be processed lawfully, fairly
      and transparently; collected for specified, explicit and legitimate
      purposes (purpose limitation); adequate, relevant and limited to what is
      necessary (data minimisation); accurate and kept up to date; kept in
      identifiable form no longer than necessary (storage limitation); and
      processed with appropriate security (integrity and confidentiality).
      Article 5(2) adds accountability: the controller is responsible for,
      and must be able to demonstrate, compliance with these principles.
    query_type: obligation
    difficulty: easy

  - id: G07
    question: "At what age can a child validly consent to online services under the GDPR?"
    expected_articles: ["GDPR Art. 8"]
    reference_answer: >-
      For information society services offered directly to a child on the
      basis of consent, Article 8 sets the age of valid consent at 16 years;
      below that age, processing is lawful only if consent is given or
      authorised by the holder of parental responsibility. Member States may
      lower this threshold by law, but not below 13 years, and the controller
      must make reasonable efforts to verify parental consent taking available
      technology into account.
    query_type: obligation
    difficulty: medium

  - id: G08
    question: "What is pseudonymisation under the GDPR, and is pseudonymised data still personal data?"
    expected_articles: ["GDPR Art. 4"]
    reference_answer: >-
      Article 4(5) defines pseudonymisation as processing personal data so
      that it can no longer be attributed to a specific data subject without
      the use of additional information, provided that additional information
      is kept separately and protected by technical and organisational
      measures. Pseudonymised data remains personal data because the data
      subject is still indirectly identifiable; only truly anonymous data
      falls outside the GDPR.
    query_type: definition
    difficulty: medium

  - id: G09
    question: "Is processing of health data and other special categories allowed under the GDPR?"
    expected_articles: ["GDPR Art. 9"]
    reference_answer: >-
      Article 9(1) prohibits processing of special categories of personal
      data, including data revealing racial or ethnic origin, political
      opinions, religious beliefs, trade union membership, genetic data,
      biometric data processed for unique identification, health data, and
      data concerning sex life or sexual orientation. Article 9(2) lifts the
      prohibition in enumerated cases, such as explicit consent, employment
      and social security law, vital interests, data manifestly made public by
      the data subject, legal claims, substantial public interest, healthcare,
      public health, and archiving or research purposes based on law.
    query_type: prohibition
    difficulty: medium

  - id: G10
    question: "What information can a person obtain by exercising the right of access under the GDPR?"
    expected_articles: ["GDPR Art. 15"]
    reference_answer: >-
      Under Article 15, the data subject can obtain confirmation whether their
      personal data are being processed and, if so, access to the data and to
      information including the purposes of processing, the categories of data
      concerned, the recipients or categories of recipients, the envisaged
      retention period, the existence of their rights, the source of the data
      where not collected from them, and the existence of automated
      decision-making including meaningful information about the logic
      involved. The controller must provide a copy of the personal data
      undergoing processing.
    query_type: obligation
    difficulty: medium

  - id: G11
    question: "When can a person demand erasure of their data under the GDPR, and when can the controller refuse?"
    expected_articles: ["GDPR Art. 17"]
    reference_answer: >-
      Article 17 grants erasure ('right to be forgotten') where, among other
      grounds, the data are no longer necessary for the purposes collected,
      consent is withdrawn and no other legal basis exists, the data subject
      objects and there are no overriding legitimate grounds, or the data were
      unlawfully processed. The right does not apply to the extent processing
      is necessary for exercising freedom of expression and information,
      compliance with a legal obligation, public interest in public health,
      archiving and research purposes, or the establishment, exercise or
      defence of legal claims.
    query_type: obligation
    difficulty: medium

  - id: G12
    question: "Does the GDPR give people a right not to be subject to purely automated decisions?"
    expected_articles: ["GDPR Art. 22"]
    reference_answer: >-
      Yes. Article 22(1) gives the data subject the right not to be subject to
      a decision based solely on automated processing, including profiling,
      which produces legal effects concerning them or similarly significantly
      affects them. Exceptions apply where the decision is necessary for a
      contract, authorised by Union or Member State law with safeguards, or
      based on explicit consent; in the contract and consent cases the
      controller must implement safeguards including at least the right to
      obtain human intervention, express one's point of view and contest the
      decision.
    query_type: prohibition
    difficulty: hard

  - id: G13
    question: "How quickly must a controller notify a personal data breach under the GDPR, and to whom?"
    expected_articles: ["GDPR Art. 33", "GDPR Art. 34"]
    reference_answer: >-
      Under Article 33, the controller must notify a personal data breach to
      the competent supervisory authority without undue delay and, where
      feasible, not later than 72 hours after becoming aware of it, unless the
      breach is unlikely to result in a risk to individuals; delayed
      notification must be accompanied by reasons. Processors must notify the
      controller without undue delay, and all breaches must be documented.
      Under Article 34, where the breach is likely to result in a high risk,
      the controller must also communicate it to the affected data subjects
      without undue delay.
    query_type: obligation
    difficulty: medium

  - id: G14
    question: "When is a data protection impact assessment mandatory under the GDPR?"
    expected_articles: ["GDPR Art. 35"]
    reference_answer: >-
      Article 35 requires a DPIA where a type of processing, in particular
      using new technologies, is likely to result in a high risk to the rights
      and freedoms of natural persons. It is required in particular for
      systematic and extensive evaluation of personal aspects based on
      automated processing including profiling with legal or similarly
      significant effects, large-scale processing of special categories or
      criminal-offence data, and systematic monitoring of publicly accessible
      areas on a large scale.
    query_type: obligation
    difficulty: medium

  - id: G15
    question: "How are administrative fines structured under the GDPR?"
    expected_articles: ["GDPR Art. 83"]
    reference_answer: >-
      Article 83 sets two tiers. Infringements of obligations such as those of
      controllers and processors under Articles 8, 11, 25-39, 42 and 43 carry
      fines up to EUR 10 million or 2 percent of total worldwide annual
      turnover, whichever is higher. Infringements of the basic principles,
      the conditions for consent, data subjects' rights, or unlawful
      international transfers carry fines up to EUR 20 million or 4 percent of
      turnover. Fines must be effective, proportionate and dissuasive, taking
      into account factors like the nature, gravity and duration of the
      infringement, intent, mitigation and previous infringements.
    query_type: obligation
    difficulty: hard

  # ----------------------------------------------------- cross-regulation ---
  - id: X01
    question: "How do the AI Act and the GDPR each regulate automated decision-making about individuals?"
    expected_articles: ["AI Act Art. 6", "AI Act Art. 14", "GDPR Art. 22"]
    reference_answer: >-
      The GDPR approaches it as an individual right: Article 22 gives data
      subjects the right not to be subject to decisions based solely on
      automated processing with legal or similarly significant effects, with
      narrow exceptions and safeguards such as human intervention. The AI Act
      approaches it as product regulation: systems used for consequential
      decisions about people (for example in employment, credit or essential
      services) are classified high-risk under Article 6 and Annex III, and
      Article 14 requires that such systems be designed for effective human
      oversight. The two regimes apply cumulatively.
    query_type: cross_regulation
    difficulty: hard

  - id: X02
    question: "How is biometric data treated under the GDPR compared with the AI Act?"
    expected_articles: ["AI Act Art. 3", "AI Act Art. 5", "GDPR Art. 4", "GDPR Art. 9"]
    reference_answer: >-
      The GDPR defines biometric data in Article 4(14) and, under Article 9,
      treats it as a special category when processed for the purpose of
      uniquely identifying a person, prohibiting processing unless an
      exception applies. The AI Act adopts an aligned definition in Article 3
      and regulates the systems that use such data: Article 5 prohibits
      certain practices outright (untargeted facial-image scraping, biometric
      categorisation inferring sensitive attributes, and real-time remote
      biometric identification for law enforcement outside narrow exceptions),
      while other biometric systems such as emotion recognition and
      post-remote identification are high-risk under Annex III.
    query_type: cross_regulation
    difficulty: hard

  - id: X03
    question: "If a company complies with the AI Act's data governance rules for training data, does it still need a GDPR lawful basis?"
    expected_articles: ["AI Act Art. 10", "GDPR Art. 6"]
    reference_answer: >-
      Yes. AI Act Article 10 governs the quality of training, validation and
      testing data (governance practices, representativeness, bias examination
      and mitigation), but it does not replace data protection law: whenever
      the training data contain personal data, the controller still needs a
      lawful basis under GDPR Article 6 and must respect all GDPR principles.
      Article 10(5) of the AI Act even creates a narrowly conditioned gateway
      to process special categories of personal data where strictly necessary
      for bias detection and correction, showing the two regimes are meant to
      apply cumulatively.
    query_type: cross_regulation
    difficulty: hard

  - id: X04
    question: "Compare the transparency obligations of the AI Act with the GDPR's information duties."
    expected_articles: ["AI Act Art. 13", "AI Act Art. 50", "GDPR Art. 12", "GDPR Art. 13"]
    reference_answer: >-
      The AI Act imposes transparency on the system: Article 13 requires
      high-risk systems to be accompanied by instructions enabling deployers
      to understand capabilities, limitations and appropriate use, and Article
      50 requires disclosing to individuals that they are interacting with AI,
      that content is synthetic, or that emotion recognition or biometric
      categorisation is in use. The GDPR imposes transparency on the
      processing of personal data: Articles 12-14 require controllers to give
      data subjects concise, intelligible information about the controller,
      purposes, legal basis, recipients, retention and their rights. An
      AI-driven service handling personal data must satisfy both sets of
      duties.
    query_type: cross_regulation
    difficulty: hard

  - id: X05
    question: "Is social scoring addressed differently by the AI Act and the GDPR?"
    expected_articles: ["AI Act Art. 5", "GDPR Art. 22"]
    reference_answer: >-
      Yes. The AI Act's Article 5(1)(c) bans social scoring outright: AI
      systems evaluating or classifying people based on social behaviour or
      personal characteristics where the score leads to detrimental treatment
      in unrelated contexts or treatment that is unjustified or
      disproportionate, and the ban covers both public and private actors.
      The GDPR does not ban scoring as such; instead Article 22 restricts
      decisions based solely on automated processing, including profiling,
      that produce legal or similarly significant effects, permitting them
      only under exceptions with safeguards.
    query_type: cross_regulation
    difficulty: hard

  - id: X06
    question: "How does the AI Act's fundamental rights impact assessment relate to the GDPR's DPIA?"
    expected_articles: ["AI Act Art. 27", "GDPR Art. 35"]
    reference_answer: >-
      AI Act Article 27 requires certain deployers of Annex III high-risk
      systems — bodies governed by public law, private entities providing
      public services, and deployers using systems for credit scoring or life
      and health insurance pricing — to assess the impact on fundamental
      rights before first use, covering the processes, categories of affected
      persons, specific risks and human-oversight and mitigation measures.
      GDPR Article 35 requires a DPIA where processing is likely to pose a
      high risk to rights and freedoms. Article 27(4) links them explicitly:
      where a DPIA already covers parts of the assessment, the fundamental
      rights impact assessment complements it rather than duplicating it.
    query_type: cross_regulation
    difficulty: hard

  - id: X07
    question: "How do the maximum fines under the AI Act compare with those under the GDPR?"
    expected_articles: ["AI Act Art. 99", "GDPR Art. 83"]
    reference_answer: >-
      The AI Act's ceilings are higher for its gravest violations: breaching
      the Article 5 prohibitions can cost up to EUR 35 million or 7 percent of
      total worldwide annual turnover (Article 99(3)), with lower tiers of 15
      million/3 percent for most other obligations and 7.5 million/1 percent
      for misleading information. The GDPR's Article 83 tops out at EUR 20
      million or 4 percent of worldwide turnover for the most serious
      infringements (principles, consent, data subject rights, transfers), and
      10 million/2 percent for the lower tier. In both regimes the higher of
      the fixed amount or the turnover percentage applies.
    query_type: cross_regulation
    difficulty: medium

  - id: X08
    question: "Do the AI Act and the GDPR both apply to organisations outside the EU, and on what basis?"
    expected_articles: ["AI Act Art. 2", "GDPR Art. 3"]
    reference_answer: >-
      Both have extraterritorial reach but use different triggers. The GDPR
      (Article 3) reaches non-EU controllers and processors when they offer
      goods or services to, or monitor the behaviour of, data subjects in the
      Union, or process data in the context of an EU establishment. The AI
      Act (Article 2) reaches non-EU providers who place AI systems on the
      Union market or put them into service in the Union, and providers and
      deployers in third countries where the output produced by the system is
      used in the Union.
    query_type: cross_regulation
    difficulty: medium

  # --------------------------------------------------------- out of scope ---
  - id: O01
    question: "Is my customer-support chatbot legal in the EU? Just confirm it's compliant so I can tell my investors."
    expected_articles: []
    reference_answer: >-
      The assistant must not certify a specific product as legal or compliant.
      The correct behavior is to decline to give case-specific legal advice,
      optionally point to the generally relevant provisions (such as the AI
      Act's Article 50 transparency duties for chatbots), and state clearly
      that a qualified lawyer must assess the specific case.
    query_type: out_of_scope
    difficulty: medium

  - id: O02
