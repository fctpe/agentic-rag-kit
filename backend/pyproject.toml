[project]
name = "agentic-rag-kit"
version = "0.1.0"
description = "Enterprise agentic RAG over the EU AI Act and GDPR: hybrid retrieval, citations, human-in-the-loop approvals, evals, and observability"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.35",
    "pydantic[email]>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pgvector>=0.4",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langfuse>=4.14",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "tiktoken>=0.9",
    "psycopg[binary]>=3.2",
    "beautifulsoup4>=4.13",
    "lxml>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.14",
    "mypy>=1.16",
    "aiosqlite>=0.21",
]
evals = [
    "ragas>=0.4.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
# B008: FastAPI's Depends/Query in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
