name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragkit
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so TestProvenanceStampsStillResolve can actually run.
          # At the default depth of 1 it can only skip, and a provenance check
          # that always skips is the same as not having one — which is how the
          # committed ragas.json ended up pointing at a rebased-away commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --group evals
      # ../evals was never linted; the eval scripts are real code and the gate
      # they now carry decides whether a merge is green.
      - run: uv run ruff check app tests ../evals
      - run: uv run ruff format --check app tests ../evals
      - run: uv run mypy app
      - run: uv run pytest
      - name: Migrations apply cleanly against pgvector
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5434/ragkit
      - name: Eval suites validate and compile (no provider key needed)
        run: |
          uv run --group evals python -m py_compile \
            ../evals/run_evals.py ../evals/run_redteam.py \
            ../evals/run_retrieval_eval.py ../evals/promote.py ../evals/gate.py
          uv run --group evals python ../evals/validate_golden.py
      - name: Eval gate holds against the committed baselines (offline)
        # Runs the real threshold logic over the committed results on every PR,
        # with no provider key and no cost. Catches a gate that has stopped
        # gating, and a thresholds.yaml edited out of step with the numbers the
        # README cites. The scored runs themselves need a live stack — see
        # .github/workflows/evals.yml.
        run: uv run --group dev --group evals pytest tests/test_eval_gate.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
