name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragkit
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app tests
      - run: uv run pytest
      - name: Migrations apply cleanly against pgvector
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5434/ragkit
      - name: Eval suites validate and compile (no provider key needed)
        run: |
          uv run --group evals python -m py_compile \
            ../evals/run_evals.py ../evals/run_redteam.py ../evals/run_retrieval_eval.py
          uv run --group evals python ../evals/validate_golden.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
