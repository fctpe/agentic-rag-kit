name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragkit
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so TestProvenanceStampsStillResolve can actually run.
          # At the default depth of 1 it can only skip, and a provenance check
          # that always skips is the same as not having one — which is how the
          # committed ragas.json ended up pointing at a rebased-away commit.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --group dev --group evals
      # ../evals was never linted; the eval scripts are real code and the gate
      # they now carry decides whether a merge is green.
      - run: uv run ruff check app tests ../evals
      - run: uv run ruff format --check app tests ../evals
      - run: uv run mypy app
      - run: uv run pytest
      - name: Migrations apply cleanly against pgvector
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5434/ragkit

      - name: The committed corpus reproduces — text AND vectors, no provider key
        # The check whose absence let a false guarantee ship. A previous round
        # committed the contextual prefixes, hashed chunks.context_prefix twice,
        # and published "two ingests produce byte-identical chunks" while
        # chunks.embedding — the column the vector arm ranks on — differed in
        # 99-141 of 284 rows every time. corpus_digest hashes both columns.
        #
        # This step can exist at all only because a fixture ingest now calls no
        # provider: text, contextual prefixes and embedding vectors are all read
        # from data/fixtures/. No key, no cost, every push.
        #
        # The second half re-runs the retrieval eval against the unchanged
        # corpus and diffs it. That is the SQL half of the same property: with
        # `ORDER BY f.score DESC` and no tiebreak, question A07's rank-1 result
        # depended on the query plan and hybrid MRR moved 0.0132 with the data
        # identical. Compared to itself, not to a committed baseline, so this
        # gates determinism without going red on a number someone re-measured.
        run: |
          set -euo pipefail
          uv run python -m app.ingestion.pipeline --source fixture
          uv run python -m app.ingestion.corpus_digest | tee digest-1.txt
          uv run --group evals python ../evals/run_retrieval_eval.py \
            --mode hybrid --json eval-1.json > /dev/null
          uv run python -m app.ingestion.pipeline --source fixture
          uv run python -m app.ingestion.corpus_digest | tee digest-2.txt
          uv run --group evals python ../evals/run_retrieval_eval.py \
            --mode hybrid --json eval-2.json > /dev/null
          diff digest-1.txt digest-2.txt
          uv run python - <<'PY'
          import json, sys
          def load(path):
              payload = json.load(open(path))
              payload["summary"].pop("timestamp")
              return payload
          a, b = load("eval-1.json"), load("eval-2.json")
          if a != b:
              sys.exit("retrieval differs across two runs of one corpus")
          print("retrieval identical across ingests:", a["summary"])
          PY
        env:
          DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5434/ragkit
      - name: Eval suites validate and compile (no provider key needed)
        run: |
          uv run --group evals python -m py_compile \
            ../evals/run_evals.py ../evals/run_redteam.py \
            ../evals/run_retrieval_eval.py ../evals/promote.py ../evals/gate.py
          uv run --group evals python ../evals/validate_golden.py
      - name: Eval gate holds against the committed baselines (offline)
        # Runs the real threshold logic over the committed results on every PR,
        # with no provider key and no cost. Catches a gate that has stopped
        # gating, and a thresholds.yaml edited out of step with the numbers the
        # README cites. The scored runs themselves need a live stack — see
        # .github/workflows/evals.yml.
        run: uv run --group dev --group evals pytest tests/test_eval_gate.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
