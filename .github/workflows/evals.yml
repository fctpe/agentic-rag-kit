# Scored eval suites against a live stack.
#
# Kept out of ci.yml deliberately. These runs need Postgres, an ingested corpus,
# and a provider key, and they cost real money per run — so they are not a
# per-push gate. The per-push gate is the offline threshold check in ci.yml,
# which validates the committed baselines without a key.
#
# Weekly rather than nightly: the corpus and prompts do not change daily, and a
# weekly run is enough to catch model-side drift without burning credit. Runs on
# demand too, which is the mode that matters after a prompt or retrieval change.
name: Evals

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

jobs:
  scored:
    runs-on: ubuntu-latest
    # A fork PR has no secret, and a run without a key would report a
    # meaningless green. Skip loudly instead.
    if: github.repository == 'fctpe/agentic-rag-kit'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: ragkit
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U rag -d ragkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5434/ragkit
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JWT_SECRET: ${{ secrets.EVAL_JWT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Refuse to report a green run without a key
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is empty"; exit 1; }
          test -n "$JWT_SECRET" || { echo "EVAL_JWT_SECRET secret is empty"; exit 1; }

      - run: uv sync --group dev --group evals
      - run: uv run alembic upgrade head
      - run: uv run python -m app.seed

      - name: Ingest the full corpus
        # From the committed fixture, not live EUR-Lex: the endpoint
        # intermittently answers 202 with an empty body, and a weekly scored run
        # must not go red because an upstream had a bad minute. The fixture is
        # 212 articles + 13 annexes / 280 chunks — tests/test_corpus_fixture.py
        # holds it to that. The committed baselines were measured on an earlier
        # corpus (212 articles / 283 chunks, annexes mislabelled under the last
        # article) and are stale until this workflow re-runs them.
        run: uv run python -m app.ingestion.pipeline --source fixture

      - name: Start the API
        run: |
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && break
            sleep 2
          done

      - name: Retrieval ablation (deterministic, no judge)
        run: |
          uv run --group evals python ../evals/run_retrieval_eval.py --mode hybrid
          uv run --group evals python ../evals/run_retrieval_eval.py --mode vector_only
          uv run --group evals python ../evals/run_retrieval_eval.py --mode text_only

      - name: Red team
        run: uv run --group evals python ../evals/run_redteam.py

      - name: RAGAS
        run: uv run --group evals python ../evals/run_evals.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: evals/results/
