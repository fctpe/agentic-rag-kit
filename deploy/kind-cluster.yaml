# One node, published :80, and the label the ingress-nginx kind manifest
# schedules its controller onto. Used by .github/workflows/k8s.yml and by
# anyone reproducing it locally:
#
#   kind create cluster --name ragkit --config deploy/kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
